<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd; /* 淡蓝色背景 */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* 确保内容至少占据整个视口高度 */
        }
        #chat {
            width: 90%; /* 窗口宽度的 90% */
            max-width: 800px; /* 最大宽度 */
            height: 90vh; /* 窗口高度的 90% */
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user {
            align-self: flex-end;
            background-color: #bbdefb; /* 淡蓝色背景 */
            color: #000; /* 黑色文字 */
        }
        .ai {
            align-self: flex-start;
            background-color: white; /* 白色背景 */
            color: black; /* 黑色文字 */
            border: 1px solid #ddd; /* 添加边框 */
        }
        .ai *:not(code):not(pre) {
            color: black !important; /* 强制黑色字体 */
        }
        #input {
            display: flex;
            padding: 16px;
            background-color: #f9f9f9;
            border-top: 1px solid #eee;
            gap: 10px;
            align-items: center;
        }
        #userInput {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            resize: none;
        }
        #userInput:focus {
            border-color: #007bff;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #sendButton {
            background-color: #007bff;
            color: white;
        }
        #stopButton {
            background-color: #dc3545;
            color: white;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #modelSelect {
            margin-left: 12px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }
        .typing-indicator {
            display: inline-block;
            padding: 8px 12px;
            background-color: white; /* 与AI消息背景一致 */
            border: 1px solid #ddd; /* 与AI消息边框一致 */
            border-radius: 12px;
            color: #666; /* 灰色文字 */
            font-style: italic;
        }
        /* ---------- 特效部分 ---------- */
        .think {
            background-color: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            color: #666;
            font-style: italic;
            border-left: 4px solid #007bff;
            margin: 8px 0;
            display: block;
        }
        code {
            background-color: #f8f9fa; /* 浅灰色背景 */
            color: #212529; /* 深灰色文字 */
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            border: 1px solid #dee2e6;
            font-size: 0.95em;
        }
        pre {
            background-color: #f8f9fa; /* 浅灰色背景 */
            color: #212529; /* 深灰色文字 */
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            margin: 10px 0;
            line-height: 1.5;
        }
        hr {
            border: 0;
            height: 1px;
            background: #dee2e6;
            margin: 15px 0;
        }
        strong {
            color: #000; /* 黑色文字 */
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="chat">
        <div id="messages"></div>
        <div id="input">
            <select id="modelSelect">
                <option value="deepseek-v3">DeepSeek-V3</option>
                <option value="deepseek-r1">DeepSeek-R1</option>
                <option value="deepseek-llm-67b-chat">DeepSeek-LLM-67B-Chat</option>
            </select>
            <input type="text" id="userInput" placeholder="输入你的消息...">
            <button id="sendButton" onclick="sendMessage()">发送</button>
            <button id="stopButton" onclick="stopThinking()" disabled>停止思考</button>
        </div>
    </div>

    <script>
        let isWaitingForResponse = false;
        let controller = null; // 用于中止fetch请求
        let chatHistory = []; // 保存聊天记录

        // 强化格式化函数
        function formatDeepSeekResponse(text) {
            // 处理 <think>（支持多行）
            text = text.replace(/<think>([\s\S]*?)<\/think>/g, '<span class="think">$1</span>');
            // 处理 *** 分隔线（前后自动换行）
            text = text.replace(/\n\*\*\*\n/g, '\n<hr>\n');
            // 处理 ### 标题
            text = text.replace(/### (.*?)\n/g, '<h3>$1</h3>');
            // 处理加粗
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // 处理代码块（精确匹配 ```...```）
            text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
            // 处理行内代码
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            return text;
        }

        async function sendMessage() {
            if (isWaitingForResponse) return;

            const userInput = document.getElementById('userInput').value;
            if (!userInput) return;

            // 禁用UI
            isWaitingForResponse = true;
            document.getElementById('userInput').disabled = true;
            document.getElementById('sendButton').disabled = true;
            document.getElementById('stopButton').disabled = false;
            document.getElementById('modelSelect').disabled = true;

            // 显示用户消息
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML += `<div class="message user"><strong>你：</strong>${userInput}</div>`;
            document.getElementById('userInput').value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // 将用户消息添加到聊天记录
            chatHistory.push({ role: 'user', content: userInput });

            // 创建 AbortController
            controller = new AbortController();
            const signal = controller.signal;

            // 显示AI的“正在思考”提示
            const aiMessage = document.createElement('div');
            aiMessage.className = 'message ai';
            aiMessage.innerHTML = `<strong>AI：</strong><span class="typing-indicator">AI 正在思考...</span>`;
            messagesDiv.appendChild(aiMessage);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // 发送请求
            try {
                const response = await fetch('https://www.deepseekapp.io/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer sk-PRx8SirvbTDMQTq86UuiRchSxxbTL1FU7oGWPGV5X71uPCqO'
                    },
                    body: JSON.stringify({
                        model: document.getElementById('modelSelect').value,
                        messages: chatHistory, // 使用完整的聊天记录
                        stream: true
                    }),
                    signal: signal // 传递 AbortSignal
                });

                // 移除“正在思考”提示
                aiMessage.querySelector('.typing-indicator').remove();

                // 流式处理
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let aiResponse = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n').filter(line => line.trim());

                    for (const line of lines) {
                        const message = line.replace(/^data: /, '');
                        if (message === '[DONE]') break;

                        try {
                            const parsed = JSON.parse(message);
                            const content = parsed.choices[0]?.delta?.content || '';
                            if (content) {
                                aiResponse += content;

                                // 渐进式格式化（避免正则匹配不完整）
                                let formatted = aiResponse
                                    .replace(/<think>([\s\S]*?)$/, '<span class="think">$1</span>') // 处理未闭合的<think>
                                    .replace(/```(\w+)?\n([\s\S]*?)$/, '```$1\n$2</pre>') // 处理未闭合的代码块
                                    .replace(/`([^`]+)$/, '<code>$1</code>'); // 处理未闭合的行内代码

                                formatted = formatDeepSeekResponse(formatted); // 最终格式化

                                // 更新AI消息内容
                                aiMessage.innerHTML = `<strong>AI：</strong>${formatted}`;
                                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                            }
                        } catch (error) {
                            console.error('解析错误:', error);
                        }
                    }
                }

                // 将 AI 响应添加到聊天记录
                chatHistory.push({ role: 'assistant', content: aiResponse });

            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('请求被中止');
                    aiMessage.innerHTML += `<br><em>（已停止思考）</em>`;
                } else {
                    console.error('请求错误:', error);
                    aiMessage.innerHTML += `<br><em>（请求出错，请重试）</em>`;
                }
            } finally {
                // 重新启用UI
                isWaitingForResponse = false;
                document.getElementById('userInput').disabled = false;
                document.getElementById('sendButton').disabled = false;
                document.getElementById('stopButton').disabled = true;
                document.getElementById('modelSelect').disabled = false;
            }
        }

        function stopThinking() {
            if (controller) {
                controller.abort(); // 中止fetch请求
            }
        }

        // 回车发送
        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
