<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>AI PPT</title>
    <style>
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
            background-color: #fff;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #c1c1c1;
        }
        .docmee {
            z-index: 9999;
            background-image: linear-gradient(to left, rgb(107, 90, 196), rgb(96, 84, 189));
            background-clip: text;
            color: transparent;
            font-weight: bold;
            display: inline-block;
            font-size: 1.125rem;
            line-height: 1.75rem;
            user-select: none;
            cursor: pointer;
            position: fixed;
            top: 10px;
            left: 15px;
        }
        #div1 {
            text-align: center;
            margin-top: 60px;
        }
        #div1, #div2, #div3, #nextTo2, #nextTo3, #desc, #right_canvas {
            display: none;
        }
        #outline {
            text-align: left;
            margin: 0 calc(20vw);
        }
        #templates {
            width: 80%;
            max-width: 1050px;
            margin: auto;
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
            align-items: center;
            text-align: center;
        }
        .template {
            margin: 8px;
            width: 240px;
            height: 136px;
            cursor: pointer;
            overflow: hidden;
            border-radius: 12px;
            background-color: #ecedf4;
            border: 2px solid transparent;
        }
        .template img {
            width: 100%;
            height: 100%;
            opacity: 1;
            object-fit: cover;
            transition: all .6s ease;
        }
        .template img:hover {
            transform: scale(1.2);
            transition-duration: .3s;
        }
        h1 {
            font-size: 1.6em;
            margin-block-start: 0.5em;
            margin-block-end: 0.5em;
        }
        h2 {
            font-size: 1.3em;
            margin-block-start: 0.7em;
            margin-block-end: 0.7em;
        }
        h3 {
            font-size: 1.1em;
            margin-block-start: 0.9em;
            margin-block-end: 0.9em;
        }
        h4 {
            margin-block-start: 1.1em;
            margin-block-end: 1.1em;
        }
        ul {
            list-style: none;
        }
        #pptDownload {
            display: none;
            float: right;
        }
        .left_div {
            align-items: center;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 96vh;
            justify-content: center;
            position: absolute;
            width: 158px;
        }
        .left_div_child {
            background: #fff;
            border: 1px solid #fff;
            border-radius: 6px;
            box-shadow: 0 4px 10px 0 #0003;
            margin-left: 12px;
            margin-top: 28px;
            max-height: calc(100vh - 130px);
            width: 200px;
        }
        .left_div_child_child {
            max-height: calc(100vh - 130px);
            overflow-x: hidden;
            overflow-y: auto;
            padding: 0 8px 0 2px;
        }
        .left_div_item {
            display: flex;
            cursor: pointer;
            margin: 10px 0;
        }
        .left_div_item_index {
            color: #8d90a5;
            flex-shrink: 0;
            padding-right: 6px;
            padding-top: 30px;
            text-align: right;
            width: 23px;
        }
        .left_div_item_img {
            height: 80px;
            border: 1px solid #ccc;
        }
        .right_div {
            position: absolute;
            margin-left: 280px;
            top: 50%;
            transform: translateY(-50%);
        }
        #right_canvas {
            margin: 0px auto;
            display: block;
            border: 1px solid #666;
        }
        .item_select {
            border: 2px solid #491ff8;
        }
        .draw_el_class {
            position: fixed;
        }
        .draw_el_class:hover {
            cursor: text;
            border: 1.5px solid red;
        }
        .lang-switch {
            position: fixed;
            top: 10px;
            right: 15px;
            z-index: 9999;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            user-select: none;
        }
        .lang-switch:hover {
            color: #491ff8;
        }
    </style>
</head>
<body>
<a href="https://docmee.cn" target="_blank" class="docmee" data-i18n="brand_title" title="进入文多多AiPPT官网">文多多 AiPPT</a>
<div class="lang-switch" onclick="toggleLanguage()">
    <span id="lang-text">EN</span>
</div>
<!-- 大纲生成 -->
<div id="div1">
    <div style="margin-bottom: 50px;">
        <h1 data-i18n="page1_title">🤖 AI智能生成PPT演示文稿</h1>
        <div style="font-size: 14px;color: #999;" data-i18n="page1_steps">生成大纲 ---&gt; 挑选模板 ---&gt; 实时生成PPT</div>
    </div>
    <label data-i18n="subject_label">主题：</label>
    <input type="text" id="subject" data-i18n-placeholder="subject_placeholder" placeholder="请输入PPT主题" maxlength="30" />
    <button onclick="generateOutline()" data-i18n="generate_outline_btn">生成大纲</button>
    <button id="nextTo2" class="next_but" onclick="nextTo2()" data-i18n="next_to_template_btn">下一步：选择模板</button>
    <div id="outline"></div>
</div>
<!-- 选择模板 -->
<div id="div2">
    <div style="text-align: center;margin: 10px;">
        <div data-i18n="select_template_title">---- 选择模板 ----</div>
        <button id="nextTo3" class="next_but" style="margin-top: 10px;" onclick="nextTo3()" data-i18n="next_to_generate_btn">下一步：生成PPT</button>
    </div>
    <div id="templates" data-i18n="templates_loading">模板加载中...</div>
</div>
<!-- PPT页面 -->
<div id="div3">
    <div id="desc" style="text-align: center;margin-top: 20px">
        <span id="desc_msg" data-i18n="generating_msg">正在生成中，请稍后...</span>
        <span id="desc_time" style="margin-left: 5px"></span>
    </div>
    <div class="left_div">
        <div class="left_div_child">
            <div id="left_image_list" class="left_div_child_child"></div>
        </div>
    </div>
    <div class="right_div">
        <select id="insert_element" style="display: none;margin-left: 10px" onchange="insertElement(this.value.split(',')[0], this.value.split(',')[1])">
            <option value="" data-i18n="insert_element_title">-- 插入元素 --</option>
            <option value="text,title1" data-i18n="insert_title1">插入大标题</option>
            <option value="text,title2" data-i18n="insert_title2">插入副标题</option>
            <option value="text,content" data-i18n="insert_content">插入正文文本</option>
            <option value="image" data-i18n="insert_image">插入图片</option>
            <option value="geometry" data-i18n="insert_geometry">插入随机形状</option>
            <option value="table" data-i18n="insert_table">插入表格</option>
            <option value="chart,bar" data-i18n="insert_bar_chart">插入柱状图</option>
            <option value="chart,pie" data-i18n="insert_pie_chart">插入饼图</option>
            <option value="chart,doughnut" data-i18n="insert_doughnut_chart">插入环形图</option>
            <option value="chart,line" data-i18n="insert_line_chart">插入折线图</option>
        </select>
        <div id="pptDownload">
            <select id="download_select" style="margin-right: 5px">
                <option value="" data-i18n="download_options_title">-- 下载选项 --</option>
                <option value="0" data-i18n="download_no_animation">不添加动画</option>
                <option value="1" data-i18n="download_with_animation">智能添加动画</option>
            </select>
            <a id="downloadPptx" href="javascript:downloadPptx()" data-i18n="download_pptx_btn">渲染pptx并下载</a>
        </div>
        <div id="right_container" style="padding-top: 8px;">
            <svg id="right_canvas"></svg>
        </div>
    </div>
</div>

<script src="static/i18n.js"></script>
<script src="static/sse.js"></script>
<script src="static/chart.js"></script>
<script src="static/geometry.js"></script>
<script src="static/element.js"></script>
<script src="static/ppt2svg.js"></script>
<script src="static/ppt2canvas.js"></script>
<script src="static/base64js.js"></script>
<script src="static/pako.js"></script>
<script src="static/marked.js"></script>
<script>
    const apiKey = '4u2Fo50Alk1ym2Os'
    var pptxId = null
    var outline = ''
    var templateId = ''
    var pptxObj = null
    var selectIdx = 0
    var mTimer = null
    var gening = false

    var markdownRenderer = new marked.Renderer()
    marked.setOptions({
        renderer: markdownRenderer,
        async: false,
        gfm: true,
        tables: true,
        breaks: false,
        pedantic: false,
        silent: true
    })

    var painter = new Ppt2Svg('right_canvas')
    var canvas = painter.svgNode()
    painter.setMode('edit')
    
    function generateOutline() {
        let subject = document.getElementById('subject').value
        if (!subject) {
            alert(t('alert_empty_subject')); return;
        }
        if (gening) return;
        outline = ''
        gening = true
        const url = 'https://docmee.cn/api/public/ppt/generateOutline?apiKey=' + apiKey
        var source = new SSE(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Cache-Control': 'no-cache' },
            payload: JSON.stringify({ subject }),
        })
        source.onmessage = function (data) {
            if (!data.data || !data.data.trim().startsWith('{')) return;
            try {
                let json = JSON.parse(data.data)
                if (json.status == -1) {
                    gening = false; alert(t('alert_outline_error') + json.error); return;
                }
                outline += json.text
                document.getElementById('outline').innerHTML = window.marked.marked(outline.replaceAll('```markdown', '').replaceAll('```', ''))
                window.scrollTo({ behavior: 'smooth', top: document.body.scrollHeight })
            } catch (e) { console.error('Parse Error', e) }
        }
        source.onend = function (data) {
            gening = false;
            document.getElementById('nextTo2').style.display = 'inline-block'
            window.scrollTo(0, 0)
        }
        source.onerror = function (err) {
            gening = false; alert(t('alert_outline_error'))
        }
        source.stream()
    }

    function nextTo2() {
        document.getElementById('div1').style.display = 'none'
        document.getElementById('div2').style.display = 'block'
        loadTemplates()
    }

    function loadTemplates() {
        let url = 'https://docmee.cn/api/public/ppt/randomTemplates?apiKey=' + apiKey
        let xhr = new XMLHttpRequest()
        xhr.open('POST', url, true)
        xhr.setRequestHeader('Content-Type', 'application/json')
        xhr.send(JSON.stringify({ page: 1, size: 28, filters: { type: 1 } }))
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    let resp = JSON.parse(xhr.responseText)
                    let list = resp.data || []
                    let templates = ''
                    for (let i = 0; i < list.length; i++) {
                        templates += `<div id="${list[i].id}" class="template" onclick="selectTemplate('${list[i].id}')"><img id="img_${list[i].id}" src="${list[i].coverUrl}" /></div>`
                    }
                    document.getElementById('templates').innerHTML = templates || 'No templates found'
                    if (list.length > 0) selectTemplate(list[0].id)
                } catch(e) { console.error(e) }
            }
        }
    }

    async function selectTemplate(id) {
        if (templateId) {
            let ele = document.getElementById(templateId)
            if (ele) ele.classList.remove('item_select')
        }
        templateId = id
        let target = document.getElementById(id)
        if(target) target.classList.add('item_select')
        document.getElementById('nextTo3').style.display = 'inline-block'
        let img = document.getElementById(`img_${id}`)
        if (img) {
            let color = await calcSubjectColor(img.src)
            document.body.style.background = color
        }
    }

    function nextTo3() {
        document.body.style.background = null
        document.getElementById('div2').style.display = 'none'
        document.getElementById('div3').style.display = 'block'
        generatePptx()
    }

    function generatePptx() {
        var count = 0
        var timer = setInterval(() => {
            count++; document.getElementById('desc').style.display = 'block'
            document.getElementById('desc_time').innerHTML = count + t('seconds')
        }, 1000)

        const url = 'https://docmee.cn/api/public/ppt/generateContent?apiKey=' + apiKey
        var source = new SSE(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Cache-Control': 'no-cache' },
            payload: JSON.stringify({ outlineMarkdown: outline, asyncGenPptx: true, templateId }),
        })
        source.onmessage = function (data) {
            if (!data.data || !data.data.trim().startsWith('{')) return;
            try {
                let json = JSON.parse(data.data)
                if (json.status == -1) {
                    alert(t('alert_ppt_error') + json.error); return;
                }
                if (json.pptId) {
                    document.getElementById('desc_msg').innerText = `${t('generating_progress')} ${json.current}/${json.total}，${t('generating_msg')}`
                    asyncGenPptxInfo(json.pptId)
                }
            } catch(e) { console.error(e) }
        }
        source.onend = function () {
            clearInterval(timer)
            document.getElementById('desc').style.display = 'none'
            document.getElementById('pptDownload').style.display = 'inline-block'
            document.getElementById('insert_element').style.display = 'inline-block'
            drawPptxList()
        }
        source.onerror = function () {
            clearInterval(timer); alert(t('alert_ppt_error'))
        }
        source.stream()
    }

    function asyncGenPptxInfo(id) {
        pptxId = id
        let url = `https://docmee.cn/api/public/ppt/asyncPptInfo?apiKey=${apiKey}&pptId=${pptxId}`
        let xhr = new XMLHttpRequest()
        xhr.open('GET', url, true)
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    let resp = JSON.parse(xhr.responseText)
                    if (resp.data && resp.data.pptxProperty) {
                        let gzip = base64js.toByteArray(resp.data.pptxProperty)
                        let json = pako.ungzip(gzip, { to: 'string' })
                        pptxObj = JSON.parse(json)
                        if (pptxObj && pptxObj.pages) {
                            drawPptxList(resp.data.current - 1, true)
                        }
                    }
                } catch(e) { console.error(e) }
            }
        }
        xhr.send()
    }

    async function drawPptxList(idx, asyncGen) {
        // --- 修复点：访问 .length 之前检查 pptxObj.pages 是否存在 ---
        if (!pptxObj || !pptxObj.pages) return;

        if (idx == null || document.getElementById('img_' + idx) == null) {
            let html = ''
            for (let i = 0; i < pptxObj.pages.length; i++) {
                if (asyncGen && i > idx) break;
                html += `<div class="left_div_item" onclick="drawPptx(${i})">
                            <div class="left_div_item_index">${i+1}</div>
                            <canvas id="img_${i}" width="288" height="162" style="width: 144px;height: 81px;" class="left_div_item_img"></canvas>
                         </div>`
            }
            if (asyncGen && idx < pptxObj.pages.length - 1) {
                html += `<div class="left_div_item">
                            <div class="left_div_item_index">${idx + 2}</div>
                            <div style="width: 144px;height: 81px;text-align: center;line-height: 81px;color: #666;" class="left_div_item_img">${t('generating_msg')}</div>
                         </div>`
            }
            let itemList = document.getElementById('left_image_list')
            if (itemList) {
                itemList.innerHTML = html
                if (asyncGen) itemList.scrollTop = itemList.scrollHeight
            }
            
            for (let i = 0; i < pptxObj.pages.length; i++) {
                let canvasEle = document.getElementById('img_' + i)
                if (canvasEle) {
                    try {
                        let _ppt2Canvas = new Ppt2Canvas(canvasEle)
                        await _ppt2Canvas.drawPptx(pptxObj, i)
                    } catch(e) { console.error(e) }
                }
            }
        }
        drawPptx(idx || 0)
    }

    function drawPptx(idx) {
        if (!pptxObj || !pptxObj.pages || !pptxObj.pages[idx]) return;
        let lastSelect = document.getElementById('img_' + selectIdx)
        if (lastSelect) lastSelect.classList.remove('item_select')
        selectIdx = idx
        let current = document.getElementById('img_' + idx)
        if (current) {
            current.classList.add('item_select')
            if (idx === 0) current.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
        }
        document.getElementById('right_canvas').style.display = 'block'
        painter.drawPptx(pptxObj, idx)
    }

    function downloadPptx() {
        if (!pptxObj) return;
        let download = document.getElementById('downloadPptx')
        const originalText = download.innerText
        download.innerText = t('rendering')
        let ani = document.getElementById('download_select').value
        let xhr = new XMLHttpRequest()
        xhr.responseType = 'blob'
        xhr.open('POST', `https://docmee.cn/api/public/ppt/json2ppt?animationType=${ani||''}&apiKey=${apiKey}`)
        xhr.setRequestHeader('Content-Type', 'application/json')
        xhr.onload = function() {
            download.innerText = originalText
            if (this.status == 200) {
                let a = document.createElement('a')
                a.href = window.URL.createObjectURL(this.response)
                a.download = (document.getElementById('subject').value || 'ppt') + '.pptx'
                a.click()
            }
        }
        xhr.send(JSON.stringify(pptxObj))
    }

    async function calcSubjectColor(src) {
        return new Promise(resolve => {
            let img = new Image(); img.crossOrigin = 'anonymous'; img.src = src
            img.onload = function() {
                let cvs = document.createElement('canvas'); let ctx = cvs.getContext('2d')
                cvs.width = 1; cvs.height = 1; ctx.drawImage(img, 0, 0, 1, 1)
                let d = ctx.getImageData(0, 0, 1, 1).data
                resolve(`rgba(${d[0]},${d[1]},${d[2]},0.08)`)
            }
            img.onerror = () => resolve('#f4f4f7')
        })
    }

    function resetSize() {
        let width = Math.max(Math.min(document.body.clientWidth - 400, 1600), 480)
        painter.resetSize(width, width * 0.5625)
    }

    window.addEventListener('resize', () => {
        clearTimeout(mTimer); mTimer = setTimeout(resetSize, 50)
    })

    // Init
    document.getElementById('div1').style.display = 'block'
    applyLanguage()
    resetSize()
</script>
</body>
</html>
